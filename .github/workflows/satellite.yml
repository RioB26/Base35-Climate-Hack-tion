name: Satellite screening for a new site

on:
  repository_dispatch:
    types: [add-site]
  workflow_dispatch:
    inputs:
      site:
        description: Site id to (re)run
        required: true

permissions:
  contents: read

# One Earth Engine job at a time keeps within quota and avoids interleaved status writes.
concurrency:
  group: satellite
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Screen site
        # Shorter than the job so a timeout still reaches the failure step below.
        timeout-minutes: 25
        working-directory: pipeline
        env:
          SITE: ${{ github.event.client_payload.siteId || inputs.site }}
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run_site.py --site "$SITE"
      - name: Export screened result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-${{ github.event.client_payload.siteId || inputs.site }}
          path: pipeline/satellite-export.json
          if-no-files-found: error
      # Setup problems (bad secret, pip failure) happen before run_site can report, so say it here.
      - name: Mark site failed
        if: failure()
        working-directory: pipeline
        env:
          SITE: ${{ github.event.client_payload.siteId || inputs.site }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run_site.py --site "$SITE" --fail "Satellite job failed before finishing. See the workflow run for details."
